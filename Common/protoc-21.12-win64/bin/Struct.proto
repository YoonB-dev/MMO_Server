syntax = "proto3";
package Protocol;

import "Enum.proto";

// 패킷에서 공통으로 쓰는 구조체 (Protocol.proto에서 import "Struct.proto";로 사용)

// 서버 좌표계: y가 위쪽, yaw = y축 회전(도, +z = 0도 / +x = 90도), 단위 m
//   (Unreal은 Z가 위쪽이고 cm라서 클라에서 변환)
message PosInfo
{
	float x = 1;
	float y = 2;
	float z = 3;
	float yaw = 4;
}

// 이동 정보 (위치 + 방향 + 상태). ObjectInfo, MoveEntry가 같이 사용
message MoveInfo
{
	PosInfo pos_info = 1;	// x, y, z, yaw
	float dir_x = 2;		// 수평 이동 방향 (멈춰 있으면 0, 0)
	float dir_z = 3;
	float vel_y = 4;		// 세로 속도 (점프용, 현재 0)
	MoveState state = 5;
	float speed = 6;		// 수평 속도 (m/s, 멈춰 있으면 0). 클라는 (dir_x, dir_z) * speed로 다음 패킷까지 위치를 예측
}

// 모두에게 보이는 전투 스탯 (HP바). MP는 본인만 보는 정보라 여기 없음 (S_ENTER_GAME, S_CHANGE_MP)
message StatInfo
{
	int32 hp = 1;
	int32 max_hp = 2;
}

// 진행 중인 시전 (몬스터 예고 공격). 시전 중이 아니면 ObjectInfo에 없음 (has_cast_info() == false)
//   S_SPAWN으로 처음 보는 클라가 "이미 시전 중"인 걸 알 수 있게 (시작 순간의 S_SKILL을 못 받았어도)
message CastInfo
{
	int32 skill_id = 1;
	int32 remaining_ms = 2;	// 남은 예고 시간 (보낸 순간 기준)
	int32 total_ms = 3;		// 전체 예고 시간 -> 게이지 비율 = 1 - remaining / total
	float yaw = 4;			// 고정된 판정 방향 (도)
	float range = 5;		// 부채꼴 반지름 (m)
	float hit_angle = 6;	// 부채꼴 좌우 반각 (도)
}

// 월드에 존재하는 객체 하나 (플레이어, 몬스터 공통)
message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	MoveInfo move_info = 3;
	StatInfo stat_info = 4;		// HP바 표시용. S_ENTER_GAME, S_SPAWN에 자동으로 같이 실림
	CastInfo cast_info = 5;		// 시전 중일 때만 있음 (몬스터 예고 공격). S_SPAWN에 자동으로 같이 실림
	string name = 6;			// 플레이어 닉네임 (UTF-8, 한글 가능). 몬스터는 비어 있음
}

// S_MOVE 안의 한 명분
message MoveEntry
{
	uint64 object_id = 1;
	MoveInfo move_info = 2;
	uint32 ack_seq = 3;		// 이 플레이어 입력 중 서버가 마지막으로 적용한 번호
}