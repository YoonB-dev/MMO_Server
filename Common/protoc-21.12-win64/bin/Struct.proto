syntax = "proto3";
package Protocol;

import "Enum.proto";

// 패킷에서 공통으로 쓰는 구조체 (Protocol.proto에서 import "Struct.proto";로 사용)

// 서버 좌표계: y가 위쪽, yaw = y축 회전(도, +z = 0도 / +x = 90도), 단위 m
//   (Unreal은 Z가 위쪽이고 cm라서 클라에서 변환)
message PosInfo
{
	float x = 1;
	float y = 2;
	float z = 3;
	float yaw = 4;
}

// 이동 정보 (위치 + 방향 + 상태). ObjectInfo, MoveEntry가 같이 사용
message MoveInfo
{
	PosInfo pos_info = 1;	// x, y, z, yaw
	float dir_x = 2;		// 수평 이동 방향 (멈춰 있으면 0, 0)
	float dir_z = 3;
	float vel_y = 4;		// 세로 속도 (점프용, 현재 0)
	MoveState state = 5;
	float speed = 6;		// 수평 속도 (m/s, 멈춰 있으면 0). 클라는 (dir_x, dir_z) * speed로 다음 패킷까지 위치를 예측
}

// 모두에게 보이는 전투 스탯 (HP바). MP는 본인만 보는 정보라 여기 없음 (S_ENTER_GAME, S_CHANGE_MP)
message StatInfo
{
	int32 hp = 1;
	int32 max_hp = 2;
}

// 월드에 존재하는 객체 하나 (플레이어, 몬스터 공통)
message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	MoveInfo move_info = 3;
	StatInfo stat_info = 4;		// HP바 표시용. S_ENTER_GAME, S_SPAWN에 자동으로 같이 실림
}

// S_MOVE 안의 한 명분
message MoveEntry
{
	uint64 object_id = 1;
	MoveInfo move_info = 2;
	uint32 ack_seq = 3;		// 이 플레이어 입력 중 서버가 마지막으로 적용한 번호
}