syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

// 패킷 이름 규칙: C_ = 클라이언트 -> 서버, S_ = 서버 -> 클라이언트
// GenPackets는 줄 맨 앞이 'message'인 줄을 위에서부터 읽어 1000번부터 패킷 ID를 붙인다
//   -> 새 패킷은 맨 아래에 추가 (중간에 넣으면 뒤 패킷 ID가 전부 밀림)
// 이 파일은 CP949로 저장 (GenPackets가 시스템 기본 인코딩으로 읽음)

// ==================== 연결 확인 ====================
// 왕복 지연 측정: 서버는 받은 시각을 그대로 돌려줌
message C_PING
{
	int64 client_time_us = 1;
}

message S_PING
{
	int64 client_time_us = 1;
}

// ==================== 입장 / 퇴장 ====================
// 클라 -> 서버: 입장 요청. 아웃게임 서버(/auth/login)에서 받은 Access Token(JWT)을 같이 보냄
//   서버는 서명/만료/발급자/대상을 검증하고, 그 계정의 캐릭터를 DB에서 불러와 입장시킴
message C_ENTER_GAME
{
	string access_token = 1;
}

// 서버 -> 클라: 입장 결과. 실패해도 연결은 유지 (토큰을 갱신해서 다시 보낼 수 있게)
message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;	// 내 캐릭터
	int32 mp = 3;			// 내 MP. 본인만 보는 정보라 ObjectInfo(다른 사람 S_SPAWN에도 가는 정보)가 아니라 여기에
	int32 max_mp = 4;
	EnterGameError error = 5;	// success = false일 때 이유
}

message S_SPAWN
{
	repeated ObjectInfo objects = 1;	// 새로 보이게 된 객체들
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;	// 사라진 객체들
}

// ==================== 이동 ====================
// 클라 -> 서버: 이동 의도. 방향/버튼이 바뀔 때만 보냄 (멈추면 방향 0, 0)
message C_MOVE_INPUT
{
	float dir_x = 1;	// 월드 기준 수평 방향 (카메라 기준 변환은 클라가 함)
	float dir_z = 2;
	uint32 buttons = 3;	// 비트 플래그. bit0 = 점프 (지금은 무시)
	uint32 seq = 4;		// 입력 번호 1, 2, 3 ...
}

// 서버 -> 클라: 한 틱 동안 바뀐 이동을 한 패킷에 묶음
message S_MOVE
{
	uint64 server_tick = 1;
	repeated MoveEntry moves = 2;
}

// ==================== 전투 ====================
// 클라 -> 서버: 스킬 사용 요청. 기본 공격도 스킬 1번으로 취급
//   타겟은 클라가 고름 (하이라이트한 몬스터). 서버는 믿지 않고 자기 데이터로 다시 검사
message C_SKILL
{
	int32 skill_id = 1;		// 1 = 기본 공격 (Database/Data/skill.sql의 data_skill)
	uint64 target_id = 2;	// 공격할 몬스터 id
}

// 서버 -> 클라(전체): 스킬 사용 확정 -> 시전 모션 재생, 시전자 본인은 쿨타임 UI 시작
//   target_id = 0이면 빗나감/허공: yaw 방향으로 휘두르는 모션만 (데미지 없음)
//   cast_ms > 0이면 예고 시작 (몬스터 공격): cast_ms 동안 yaw 방향 부채꼴(range, hit_angle)을 바닥에 표시
//     -> 끝날 때 그 안에 있으면 S_CHANGE_HP가 오고, 피했으면 아무것도 안 옴
message S_SKILL
{
	uint64 object_id = 1;	// 시전자 (플레이어 또는 몬스터)
	int32 skill_id = 2;
	uint64 target_id = 3;	// 맞은 대상 / 노리는 대상 (0 = 빗나감)
	float yaw = 4;			// 시전자가 바라보는 방향 (서버 좌표, 도). 예고 공격이면 판정 방향
	int32 cast_ms = 5;		// 예고 시간 (0 = 즉시, 이 패킷이 곧 결과)
	float range = 6;		// 예고 범위 표시용: 부채꼴 반지름 (m)
	float hit_angle = 7;	// 예고 범위 표시용: 좌우 반각 (도)
}

// 서버 -> 클라(전체): HP가 바뀜 -> 데미지 숫자, HP바
message S_CHANGE_HP
{
	uint64 object_id = 1;	// 맞은 객체
	int32 hp = 2;			// 바뀐 뒤 HP
	int32 damage = 3;		// 이번에 깎인 양 (표시용). 회복(몬스터 복귀, 자연 회복)이면 0
	uint64 attacker_id = 4;	// 때린 객체 (내가 때린 건지 구분용). 회복이면 0
}

// 서버 -> 클라(전체): 객체가 죽음 -> 죽는 모션 재생
//   몬스터(revive_ms 0): 서버에서 이미 사라짐 -> 모션 뒤 클라가 직접 지움 (S_DESPAWN 없음), 리스폰은 새 id로 S_SPAWN
//   플레이어(revive_ms > 0): 방에 남아 시체로 보임 -> revive_ms 뒤 S_REVIVE
message S_DIE
{
	uint64 object_id = 1;	// 죽은 객체
	uint64 killer_id = 2;	// 마지막 공격을 한 객체
	int32 revive_ms = 3;	// 플레이어면 부활까지 남은 시간 (클라 카운트다운), 몬스터면 0
}

// 서버 -> 클라(본인만): 내 MP가 바뀜 (스킬 사용, 1초마다 자연 회복) -> MP바
message S_CHANGE_MP
{
	int32 mp = 1;	// 바뀐 뒤 MP
}

// 서버 -> 클라(전체): 죽었던 플레이어가 살아남 -> object의 위치에 다시 세움 (HP는 object.stat_info)
//   본인 MP는 따로 S_CHANGE_MP로 옴
message S_REVIVE
{
	ObjectInfo object = 1;
}