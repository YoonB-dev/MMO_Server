# 이 파일을 복사해서 같은 폴더에 config.ini로 저장 (config.ini는 git에 올리지 않음)
# 빌드하면 config.ini가 실행 파일 폴더(Binary/<구성>)로 복사됨

[Database]
# 서버가 시작할 때 이 정보로 접속함 (GameServer.cpp의 USE_DATABASE, 기본 true)
# Database의 DB가 아직 없으면 먼저 Database/Setup-Database.ps1 실행 (만들어 줌)
Driver=MySQL ODBC 9.6 Unicode Driver
Server=127.0.0.1
Port=3306
Database=mmo_db
UID=root
PWD=your_password

[Server]
IP=127.0.0.1
Port=7777
WorkerThreads=5
