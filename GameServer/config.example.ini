# 이 파일을 복사해서 같은 폴더에 config.ini로 저장 (config.ini는 git에 올리지 않음)
# 빌드하면 config.ini가 실행 파일 폴더(Binary/<구성>)로 복사됨

[Database]
# ServerCore ConfigManager가 이 섹션을 필수로 읽음 (DB 연결은 GameServer.cpp에서 켜야 실제로 사용)
Driver=MySQL ODBC 9.6 Unicode Driver
Server=127.0.0.1
Port=3306
Database=mmo_db
UID=root
PWD=your_password

[Server]
IP=127.0.0.1
Port=7777
WorkerThreads=5
